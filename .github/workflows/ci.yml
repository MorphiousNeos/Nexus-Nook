name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    # Both ends of the supported range. `engines` declares ">=18.0.0", so Render
    # resolves whatever the newest release happens to be — currently 26.x, eight
    # majors above the floor. Testing only the floor left production running a
    # version CI had never once exercised.
    name: Backend (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      # One version failing should not hide the other's result.
      fail-fast: false
      matrix:
        node: ["18", "26"]
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: backend/package-lock.json
      # `npm ci` rather than `npm install`: it installs strictly from the
      # lockfile and fails when the lockfile and manifest disagree. `npm install`
      # would quietly resolve something else and report success.
      - name: Install dependencies
        run: npm ci
      - name: Syntax check
        run: |
          node --check server.js
          node --check migrate.js

  web:
    # Nothing verified that the web app compiles. The Pages workflow builds it,
    # but only on a push to a deploy branch — so pull requests changing only
    # TypeScript merged without the compiler ever running.
    name: Web (TypeScript/Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          # Matches the Pages build exactly. A different major here could pass
          # while the deploy fails, which is worse than not checking at all.
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install dependencies
        run: npm ci
      # `npm run build` is `tsc && vite build`, so this is the typecheck as well
      # as the bundle. Deliberately no VITE_API_URL: this job proves the code
      # compiles and must not be able to produce a deployable artifact.
      - name: Build
        run: npm run build

  android:
    name: Android (Kotlin/Compose)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install SDK packages
        run: sdkmanager "platforms;android-34" "build-tools;34.0.0"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.5"
      - name: Assemble debug
        run: gradle assembleDebug --no-daemon --stacktrace

  ios:
    name: iOS (Swift/SwiftUI)
    runs-on: macos-15
    defaults:
      run:
        working-directory: ios
    steps:
      - uses: actions/checkout@v4
      - name: Select latest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Build (simulator, no signing)
        run: |
          xcodebuild build \
            -project NexusNook.xcodeproj \
            -scheme NexusNook \
            -sdk iphonesimulator \
            -configuration Debug \
            CODE_SIGNING_ALLOWED=NO
