name: Keep API warm

# The API host sleeps after ~15 minutes of no traffic and then takes up to a
# minute to boot, which shows up as a stalled sign-in for whoever arrives
# first. A cheap request every 10 minutes keeps it awake.
#
# Two things worth knowing about this schedule:
#  - GitHub queues cron runs on a best-effort basis, so a tick can arrive
#    late. The landing page still warms the API on load, so a missed tick
#    degrades to a slower first sign-in rather than a broken one.
#  - GitHub disables scheduled workflows after 60 days without repository
#    activity. Re-enable it from the Actions tab if the project goes quiet.

on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

# Deliberately no `cancel-in-progress`. GitHub delays scheduled runs under
# load, so ticks bunch up — and with cancellation on, each queued run killed
# the one before it and the API was never actually pinged. Every run of this
# workflow was landing as "cancelled". A ping is short and idempotent, so
# overlapping runs are harmless.
permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    # Must exceed the worst-case retry budget below (3 x 90s plus two 15s
    # sleeps is five minutes exactly). When the budget equals the timeout the
    # runner kills the job mid-loop, and a timeout-killed job is reported as
    # "cancelled" — which reads like the old concurrency bug but is not one.
    timeout-minutes: 8
    steps:
      - name: Ping the health endpoint
        env:
          # Overridable so a fork or a moved backend does not need a code edit.
          API_URL: ${{ vars.API_URL || 'https://nexus-nook-mock-api.onrender.com' }}
        run: |
          # A sleeping instance can take ~60s to answer, so allow a generous
          # timeout and retry before giving up.
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "$API_URL/health" || echo "000")
            echo "attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              echo "API is awake."
              exit 0
            fi
            sleep 15
          done
          # Don't fail the run: a transient blip would otherwise send a failure
          # notification every ten minutes. The log still records what happened.
          echo "::error::API did not return 200 after 3 attempts."; exit 1
